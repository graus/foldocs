[project]
name = "foldocs"
version = "0.1.0"
description = "A folder of documents in Google Drive or Nextcloud, published as a static website"
readme = "README.md"
license = "AGPL-3.0-only AND MIT AND OFL-1.1"
license-files = ["LICENSE", "themes/LICENSE", "themes/default/static/fonts/OFL.txt"]
requires-python = ">=3.13"
authors = [{ name = "David Graus" }]
keywords = ["static site generator", "google drive", "google docs", "nextcloud", "website", "cms"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "requests>=2.32",
    "jinja2>=3.1",
    "mammoth>=1.11",
    "pillow>=11.0",
    "pillow-heif>=0.20",
    "tzdata>=2024.1",
    "markdown-it-py>=3.0",
]

[project.urls]
Homepage = "https://foldocs.com"
Documentation = "https://foldocs.com"
Source = "https://github.com/graus/foldocs"
Issues = "https://github.com/graus/foldocs/issues"

[project.scripts]
foldocs = "foldocs.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "python-docx>=1.2.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foldocs"]

[tool.hatch.build.targets.sdist]
include = ["foldocs", "themes", "tests", "README.md", "LICENSE"]

# The bundled themes go into the package, so an installed Foldocs has them too.
[tool.hatch.build.targets.wheel.force-include]
"themes" = "foldocs/themes"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]  # an if/else often reads better than a long conditional expression
